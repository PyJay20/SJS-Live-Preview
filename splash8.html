<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Welcome | St Joseph’s R.C. School</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0a0a23;
      overflow: hidden;
      font-family: 'Georgia', serif;
      color: white;
    }

    .splash {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #82c419, #2E7D32);
      flex-direction: column;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .logo {
      width: 160px;
      height: 160px;
      background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/St._Joseph%27s_Emblem.png/800px-St._Joseph%27s_Emblem.png') no-repeat center;
      background-size: contain;
      opacity: 0;
      margin-bottom: 30px;
      animation: float 4s ease-in-out infinite;
    }

    .school-name {
      font-size: 8rem;
      letter-spacing: 3px;
      opacity: 0;
      margin-bottom: 12px;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
    }

    .motto {
      font-size: 4.15rem;
      font-style: italic;
      color: #ccc;
      opacity: 0;
      margin-bottom: 40px;
    }

    .enter-button {
      padding: 14px 36px;
      font-size: 3.1rem;
      background: transparent;
      border: 2px solid white;
      color: white;
      cursor: pointer;
      border-radius: 50px;
      opacity: 0;
      transition: all 0.3s ease;
      animation: float 6s ease-in-out infinite;
      outline-offset: 4px;
    }

    .enter-button:hover,
    .enter-button:focus {
      background: white;
      color: #0a0a23;
      outline-offset: 0;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.7);
    }

    .fade-in {
      animation: fadeInUp 1.2s forwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    @media (max-width: 600px) {
  .logo {
    width: 220px;
    height: 220px;
    margin-bottom: 40px;
  }

  .school-name {
    font-size: 7.8rem;
    letter-spacing: 4px;
    margin-bottom: 16px;
  }

  .motto {
    font-size: 1.4rem;
    margin-bottom: 50px;
  }

  .enter-button {
    padding: 18px 44px;
    font-size: 1.3rem;
  }
}
  </style>
</head>
<body>

<div class="splash" role="main" aria-label="Welcome screen">
  <div class="logo" img-src="/images/cropped-SJS-larger-sheet512x512-192x192.jpg" aria-hidden="true"></div>
  <h1 class="school-name">St Joseph’s R.C. School</h1>
  <div class="motto">"Knowledge, Faith & Excellence"</div>
  <button class="enter-button" onclick="enterSite()" aria-label="Enter the site">Enter Site</button>
</div>

<script>
  const logo = document.querySelector('.logo');
  const name = document.querySelector('.school-name');
  const motto = document.querySelector('.motto');
  const button = document.querySelector('.enter-button');

  // Fade elements in sequentially
  setTimeout(() => logo.classList.add('fade-in'), 400);
  setTimeout(() => name.classList.add('fade-in'), 1100);
  setTimeout(() => motto.classList.add('fade-in'), 1600);
  setTimeout(() => button.classList.add('fade-in'), 2200);

  // Enter site function with fade out
  function enterSite() {
    const splash = document.querySelector('.splash');
    splash.style.transition = 'opacity 0.5s ease';
    splash.style.opacity = 0;
    setTimeout(() => {
      window.location.href = "home.html"; // change to your actual homepage file
    }, 500);
  }
</script>

</body>
</html>
